plugins {
    id 'net.minecraftforge.gradle' version '6.0.24'
    id 'java'
}

group = 'com.sosnitzka'
archivesBaseName = 'taiga'

version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

minecraft {
    mappings channel: 'official', version: '1.20.1'

    runs {
        client {
            workingDirectory project.file('run')

            mods {
                taiga {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')

            mods {
                taiga {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    maven {
        name = 'forge'
        url = 'https://maven.minecraftforge.net/'
    }

    maven {
        name = 'blamejared'
        url = 'https://maven.blamejared.com/'
    }

    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
    }

    mavenCentral()
}

dependencies {
    // Minecraft Forge 1.20.1
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.5'

    // Mantle 1.20.1
    compileOnly fg.deobf(
        'curse.maven:mantle-74924:7563777'
    )

    // Tinkers' Construct 1.20.1
    compileOnly fg.deobf(
        'curse.maven:tinkers-construct-74072:7449219'
    )
}

sourceSets {
    main {
        resources {
            srcDir 'src/main/resources'
        }
    }
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE

    inputs.property 'version', project.version
    inputs.property 'mcversion', '1.20.1'

    filesMatching('META-INF/mods.toml') {
        expand(
            version: project.version,
            mcversion: '1.20.1'
        )
    }
}

jar {
    manifest {
        attributes(
            'Specification-Title': 'taiga',
            'Specification-Vendor': 'sosnitzka',
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': project.version,
            'Implementation-Vendor': 'sosnitzka'
        )
    }

    finalizedBy 'reobfJar'
}
